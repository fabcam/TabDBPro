<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TabDB Pro — Unlock</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
    }
    .lock { font-size: 40px; }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    p { margin: 0; color: #888; font-size: 13px; max-width: 320px; }
    button {
      font-size: 14px; padding: 10px 18px; border-radius: 8px; border: none;
      background: #0078d4; color: #fff; cursor: pointer; font-weight: 500;
    }
    button:disabled { opacity: .6; cursor: default; }
    .cancel { background: transparent; color: #888; border: 1px solid #ccc; }
    #status { min-height: 16px; font-size: 12px; }
    #status.err { color: #d13438; }
  </style>
</head>
<body>
  <div class="lock">🔒</div>
  <h1>TabDB Pro</h1>
  <p id="prompt">Desbloqueá el acceso con Touch ID.</p>
  <button id="unlock">Desbloquear con Touch ID</button>
  <button id="cancel" class="cancel">Cancelar</button>
  <div id="status"></div>
  <script src="auth.js"></script>
</body>
</html>
